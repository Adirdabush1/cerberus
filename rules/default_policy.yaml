# Cerberus — default policy (V1).
#
# This is DATA, not code. Edit it freely; no rebuild required.
# Rules are evaluated top-to-bottom and the FIRST match wins.
# Each rule's `when` is a json-logic expression evaluated against a fact:
#   { tool, category, command, path, url }
# A custom `matches` op runs a regex: { matches: ["<regex>", { var: command }] }
# Actions: ALLOW | BLOCK | HITL
#
# `default` applies when no rule matches. We fail toward human review (HITL),
# never toward silent ALLOW.
default: HITL

rules:
  # ───────────────────────── BLOCK: destructive / secret access ─────────────────────────
  - id: block-rm-rf
    description: "Recursive force delete (rm -rf) is blocked outright."
    action: BLOCK
    when:
      matches: ["\\brm\\s+-([a-z]*r[a-z]*f|[a-z]*f[a-z]*r|rf|fr)\\b", { var: command }]

  - id: block-fork-bomb
    description: "Shell fork-bomb pattern is blocked."
    action: BLOCK
    when:
      matches: [":\\(\\)\\s*\\{\\s*:\\s*\\|\\s*:", { var: command }]

  - id: block-pipe-to-shell
    description: "Piping a remote download straight into a shell is blocked."
    action: BLOCK
    when:
      matches: ["(curl|wget)\\b[^|]*\\|\\s*(sudo\\s+)?(ba|z)?sh\\b", { var: command }]

  - id: block-ps-destructive-delete
    description: "Recursive/forced delete on Windows (Remove-Item -Recurse/-Force, rd /s, del /q) is blocked."
    action: BLOCK
    when:
      matches: ["\\b(Remove-Item|ri|rmdir|rd)\\b[^|;]*-(Recurse|Force)\\b|\\b(rd|rmdir)\\b[^|;]*\\s/s\\b|\\b(del|erase)\\b[^|;]*\\s/[sq]\\b", { var: command }]

  - id: block-ps-iex-download
    description: "Executing a remote download via Invoke-Expression (iex) is blocked."
    action: BLOCK
    when:
      matches: ["(Invoke-WebRequest|iwr|Invoke-RestMethod|irm|DownloadString)\\b[^|;]*\\|\\s*(Invoke-Expression|iex)\\b|\\b(Invoke-Expression|iex)\\b[^|;]*\\(\\s*(Invoke-WebRequest|iwr|Invoke-RestMethod|irm|New-Object\\s+Net\\.WebClient)", { var: command }]

  - id: block-env-read-path
    description: "Reading a .env file is blocked (secret exfiltration risk)."
    action: BLOCK
    when:
      matches: ["(^|/)\\.env(\\.[^/]*)?$", { var: path }]

  - id: block-env-read-cmd
    description: "Reading a .env file via the shell is blocked."
    action: BLOCK
    when:
      matches: ["\\b(cat|less|more|head|tail|xxd|od|Get-Content|gc|type)\\b[^&|;]*\\.env\\b", { var: command }]

  # ───────────────────────── HITL: state changers ─────────────────────────
  - id: hitl-git-push
    description: "git push to a remote requires human approval."
    action: HITL
    when:
      matches: ["\\bgit\\s+push\\b", { var: command }]

  - id: hitl-publish
    description: "Publishing a package requires human approval."
    action: HITL
    when:
      matches: ["\\b(npm|yarn|pnpm)\\s+publish\\b", { var: command }]

  - id: hitl-sudo
    description: "Privilege escalation (sudo) requires human approval."
    action: HITL
    when:
      matches: ["(^|\\s)sudo\\s", { var: command }]

  - id: hitl-chmod-permissive
    description: "Making a file world-writable/executable (chmod 777, icacls grant Everyone) requires approval."
    action: HITL
    when:
      matches: ["\\bchmod\\s+(-[a-zA-Z]+\\s+)*(0?777|a\\+rwx)\\b|\\bicacls\\b[^|;&]*/grant[^|;&]*(Everyone|Users)", { var: command }]

  - id: hitl-kill-process
    description: "Force-killing processes (kill -9, killall, taskkill /f, Stop-Process -Force) requires approval."
    action: HITL
    when:
      matches: ["\\b(kill\\s+-(9|KILL)|killall|pkill)\\b|\\btaskkill\\b[^|;&]*/f|\\bStop-Process\\b[^|;&]*-Force", { var: command }]

  # ── Persistence / backdoor-write protection (M7). Catches the classic injection payload — and the
  #    hole where `echo … >> ~/.ssh/authorized_keys` is auto-allowed because it starts with `echo`. ──
  - id: hitl-persistence-write
    description: "Writing to a shell-startup / SSH authorized_keys / cron / launchd / git-hooks path (a backdoor/persistence vector) requires approval."
    action: HITL
    when:
      or:
        - matches: ["(^|[/\\\\])\\.ssh[/\\\\]authorized_keys$|(^|[/\\\\])\\.git[/\\\\]hooks[/\\\\]|[/\\\\]etc[/\\\\](cron|systemd)|[/\\\\]Library[/\\\\]Launch(Agents|Daemons)[/\\\\]|(^|[/\\\\])\\.(bashrc|zshrc|bash_profile|zprofile|profile)$", { var: path }]
        - matches: ["(>>?|\\btee\\b)[^|;&\\n]*(\\.ssh[/\\\\]authorized_keys|\\.git[/\\\\]hooks[/\\\\]|/etc/(cron|systemd)|/Library/Launch(Agents|Daemons)|(^|[/\\\\])\\.(bashrc|zshrc|bash_profile|zprofile|profile))|\\bcrontab\\b[^|;&\\n]*(-(?!l\\b)|\\S+\\.)", { var: command }]

  # ── Sensitive-path protection (data-at-rest). Edit these patterns to fit your environment. ──
  - id: hitl-sensitive-path
    description: "Reading a sensitive path (SSH/AWS/GPG/kube keys, credential files, /etc/passwd) requires approval."
    action: HITL
    when:
      matches: ["(^|[/\\\\])\\.(ssh|aws|gnupg|kube)[/\\\\]|(^|[/\\\\])\\.(git-credentials|netrc|npmrc|pypirc)$|(^|[/\\\\])id_(rsa|dsa|ecdsa|ed25519)\\b|\\.pem$|[/\\\\]etc[/\\\\](passwd|shadow)\\b", { var: path }]

  - id: hitl-sensitive-path-cmd
    description: "Reading a sensitive path via the shell requires approval."
    action: HITL
    when:
      matches: ["\\b(cat|less|more|head|tail|xxd|od|strings|Get-Content|gc|type)\\b.*((^|[/\\\\])\\.(ssh|aws|gnupg|kube)[/\\\\]|id_(rsa|dsa|ecdsa|ed25519)|\\.pem\\b|\\.git-credentials|\\.netrc|[/\\\\]etc[/\\\\](passwd|shadow))", { var: command }]

  # Ordinary file writes are auto-approved so the agent can work day-to-day. This is safe because the
  # rules ABOVE this one (first-match-wins) already gate every dangerous write TARGET — .env (BLOCK),
  # shell-startup / authorized_keys / cron / launchd / git-hooks (hitl-persistence-write), and SSH/AWS/
  # cred paths (hitl-sensitive-path). A write driven by a poisoned instruction is still held by the
  # content signal (content-injection), independent of this rule. Every write is still audit-logged.
  - id: allow-write-category
    description: "Writing or editing an ordinary file is auto-approved (dangerous targets are gated by the rules above)."
    action: ALLOW
    when:
      "==": [{ var: category }, "WRITE"]

  # ── Egress destination policy (evaluated before the generic egress catch-all). ──
  - id: hitl-egress-suspicious
    description: "Outbound call to a known data-sink / unverified host (paste site, webhook catcher, raw IP) — review."
    action: HITL
    when:
      matches: ["https?://(\\d{1,3}\\.){3}\\d{1,3}([:/]|$)|https?://([^/]*\\.)?(pastebin\\.com|hastebin|ghostbin|webhook\\.site|requestbin|pipedream\\.net|beeceptor|ngrok\\.io|transfer\\.sh|0x0\\.st|file\\.io|termbin\\.com)", { var: url }]

  - id: allow-egress-trusted
    description: "Outbound calls to well-known developer hosts (registries, GitHub, OpenAI/Anthropic APIs) are auto-approved (a loaded secret still gates egress via the content signal)."
    action: ALLOW
    when:
      matches: ["^https?://([^/]*\\.)?(github\\.com|githubusercontent\\.com|api\\.openai\\.com|api\\.anthropic\\.com|registry\\.npmjs\\.org|npmjs\\.com|pypi\\.org|files\\.pythonhosted\\.org|crates\\.io|sum\\.golang\\.org|proxy\\.golang\\.org|gitlab\\.com|bitbucket\\.org)([:/]|$)", { var: url }]

  - id: hitl-egress-category
    description: "Other outbound network calls require human approval."
    action: HITL
    when:
      "==": [{ var: category }, "EGRESS"]

  # ───────────────────────── ALLOW: read-only / safe ─────────────────────────
  - id: allow-benign-builtins
    description: "Claude Code internal tools with no host side effect are auto-approved."
    action: ALLOW
    when:
      in:
        - { var: tool }
        - ["TodoWrite", "AskUserQuestion", "ExitPlanMode", "Task", "BashOutput", "SlashCommand"]

  - id: allow-readonly-commands
    description: "Common read-only shell commands are auto-approved in milliseconds."
    action: ALLOW
    when:
      matches:
        - "^\\s*(ls|pwd|echo|cat|grep|rg|find|head|tail|wc|which|whoami|date|env|printenv|tree|stat|file|git\\s+(status|log|diff|branch|show|remote|rev-parse)|node\\s+-v|npm\\s+(test|ls|run\\s+test)|cargo\\s+check)\\b"
        - { var: command }

  - id: allow-dev-commands
    description: "Common non-destructive dev commands (local git, scaffolding, project build/test) are auto-approved for daily use. Dangerous forms are caught by the BLOCK/HITL guards above: rm -rf, pipe-to-shell, sudo, chmod, kill, sensitive-path, persistence-write, git push, publish. Note this deliberately EXCLUDES dependency installs (npm/pip/cargo install), git clone, curl/wget, and bare interpreters (node/python) — those stay gated as a privileged/remote-fetch surface."
    action: ALLOW
    when:
      matches:
        - "^\\s*(git\\s+(add|commit|checkout|switch|restore|stash|fetch|pull|merge|rebase|tag|init|cherry-pick|clean\\s+-n)|mkdir|touch|cp|mv|ln|mktemp|npm\\s+(run|test|start)|yarn\\s+(run|test|build|lint)|pnpm\\s+(run|test|build|lint)|make|tsc|jest|vitest|mocha|eslint|prettier|cargo\\s+(build|test|check|fmt|clippy|run)|go\\s+(build|test|run|fmt|vet)|pytest|ruff|mypy|gradle|mvn)\\b"
        - { var: command }

  - id: allow-readonly-powershell
    description: "Common read-only PowerShell cmdlets (the Windows `ls`/`cat` equivalents) are auto-approved."
    action: ALLOW
    when:
      matches:
        - "^\\s*(Get-(ChildItem|Content|Location|Item|ItemProperty|Command|Help|Member|Process|Service|Date|Variable|Acl|History)|Select-(Object|String)|Where-Object|Sort-Object|Measure-Object|Group-Object|Compare-Object|Format-(Table|List|Wide)|Out-(String|Host|GridView)|Write-(Output|Host)|Test-Path|Resolve-Path|Split-Path|Join-Path|ConvertTo-(Json|Csv)|gci|gc|gi|gl|gm|gcm|gps|sls|dir|type|cls)\\b"
        - { var: command }

  - id: allow-read-category
    description: "Read-only tools (Read/Grep/Glob) are auto-approved."
    action: ALLOW
    when:
      "==": [{ var: category }, "READ"]
